<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trident Drop</title>
<style>
  :root {
    --bg: #1f1f23; --panel: #2a2a30; --panel2: #33333b; --accent: #5b8def;
    --text: #e8e8ec; --muted: #9a9aa5; --me: #3a5fb0; --them: #3a3a44; --ok: #46c46a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  .sidebar { width: 260px; background: var(--panel); border-right: 1px solid #00000040; display: flex; flex-direction: column; }
  .me { padding: 16px; border-bottom: 1px solid #00000040; }
  .me .name { font-weight: 600; font-size: 15px; }
  .me .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .peers-title { padding: 12px 16px 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .peers { flex: 1; overflow-y: auto; }
  .peer { padding: 11px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .peer:hover { background: var(--panel2); }
  .peer.active { background: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .peer .pname { font-size: 14px; }
  .empty { padding: 16px; color: var(--muted); font-size: 13px; }
  .addpeer { padding: 12px 14px; border-top: 1px solid #00000040; }
  .addpeer-title { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .addpeer-row { display: flex; gap: 6px; }
  .addpeer-row input { flex: 1; min-width: 0; background: var(--panel2); border: none; color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none; }
  .addpeer-row .btn { padding: 8px 12px; font-size: 13px; }
  .main { flex: 1; display: flex; flex-direction: column; position: relative; }
  .droplay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(91,141,239,.18); border: 3px dashed var(--accent); margin: 8px; border-radius: 14px;
    font-size: 18px; font-weight: 600; color: #cfe0ff; pointer-events: none; z-index: 5; }
  .droplay.show { display: flex; }
  .header { padding: 14px 18px; border-bottom: 1px solid #00000040; font-weight: 600; }
  .msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 70%; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
  .row.me .bubble { background: var(--me); border-bottom-right-radius: 4px; }
  .row.them .bubble { background: var(--them); border-bottom-left-radius: 4px; }
  .file { display: flex; align-items: center; gap: 10px; }
  .file a { color: #cfe0ff; font-weight: 600; text-decoration: none; }
  .file .sz { color: var(--muted); font-size: 12px; }
  .composer { padding: 14px; border-top: 1px solid #00000040; display: flex; gap: 10px; align-items: center; }
  .composer input[type=text] { flex: 1; background: var(--panel2); border: none; color: var(--text); padding: 11px 14px; border-radius: 10px; font-size: 14px; outline: none; }
  .btn { background: var(--accent); border: none; color: #fff; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .btn.icon { background: var(--panel2); padding: 10px 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #b03a3a; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; }
  .toast.show { opacity: 1; }
  .prog { height: 4px; background: var(--accent); border-radius: 2px; margin-top: 6px; width: 0; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="me">
      <div class="name" id="myName">…</div>
      <div class="sub">on this network</div>
    </div>
    <div class="peers-title">Devices nearby</div>
    <div class="peers" id="peers"><div class="empty">Searching…</div></div>
    <div class="addpeer">
      <div class="addpeer-title">Not showing up? Add by IP</div>
      <div class="addpeer-row">
        <input type="text" id="ipInput" placeholder="e.g. 192.168.1.42" autocomplete="off" />
        <button class="btn" id="addBtn">Add</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="header" id="header">Select a device to start</div>
    <div class="msgs" id="msgs"><div class="placeholder">Pick a device on the left.</div></div>
    <div class="droplay" id="droplay">Drop file to send</div>
    <div class="composer" id="composer" style="display:none">
      <input type="file" id="fileInput" style="display:none" />
      <button class="btn icon" id="attachBtn" title="Send file">📎</button>
      <input type="text" id="text" placeholder="Type a message…" autocomplete="off" />
      <button class="btn" id="sendBtn">Send</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
let me = { name: "", id: "" };
let peers = {};
let active = null;
const convos = {};   // peerId -> [ {mine, kind, ...} ]

const $ = id => document.getElementById(id);

function save() { try { localStorage.setItem("td_convos", JSON.stringify(convos)); } catch (e) {} }
function load() { try { Object.assign(convos, JSON.parse(localStorage.getItem("td_convos") || "{}")); } catch (e) {} }
load();
if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();

const ws = new WebSocket(`ws://${location.host}/ws`);

ws.onmessage = ev => {
  const m = JSON.parse(ev.data);
  if (m.type === "self") { me = m; $("myName").textContent = m.name; }
  else if (m.type === "peers") renderPeers(m.peers);
  else if (m.type === "chat") incoming(m.fromId, { mine: false, kind: "text", text: m.text });
  else if (m.type === "file") incoming(m.fromId, { mine: false, kind: "file", name: m.name, size: m.size, url: m.url });
  else if (m.type === "error") toast(m.text);
};

function renderPeers(list) {
  peers = {};
  list.forEach(p => peers[p.id] = p);
  const el = $("peers");
  if (!list.length) { el.innerHTML = '<div class="empty">No devices found yet…</div>'; }
  else {
    el.innerHTML = "";
    list.forEach(p => {
      const d = document.createElement("div");
      d.className = "peer" + (p.id === active ? " active" : "");
      d.innerHTML = `<span class="dot"></span><span class="pname"></span>`;
      d.querySelector(".pname").textContent = p.name;
      d.onclick = () => selectPeer(p.id);
      el.appendChild(d);
    });
  }
  if (active && !peers[active]) { $("header").textContent = "Device went offline"; }
}

function selectPeer(id) {
  active = id;
  $("composer").style.display = "flex";
  $("header").textContent = peers[id]?.name || "Chat";
  renderPeers(Object.values(peers));
  renderMsgs();
}

function incoming(fromId, msg) {
  (convos[fromId] ||= []).push(msg);
  save();
  const who = peers[fromId]?.name || "Someone";
  if (fromId === active && !document.hidden) { renderMsgs(); return; }
  toast(`New message from ${who}`);
  notify(who, msg.kind === "file" ? `Sent a file: ${msg.name}` : msg.text);
}

function notify(title, body) {
  if ("Notification" in window && Notification.permission === "granted")
    try { new Notification(title, { body }); } catch (e) {}
}

function renderMsgs() {
  const el = $("msgs");
  const list = convos[active] || [];
  if (!list.length) { el.innerHTML = '<div class="placeholder">No messages yet. Say hi 👋</div>'; return; }
  el.innerHTML = "";
  list.forEach(m => {
    const row = document.createElement("div");
    row.className = "row " + (m.mine ? "me" : "them");
    const b = document.createElement("div");
    b.className = "bubble";
    if (m.kind === "text") b.textContent = m.text;
    else {
      b.classList.add("file");
      const a = document.createElement("a");
      a.textContent = "⬇ " + m.name;
      if (m.url) { a.href = m.url; a.setAttribute("download", m.name); }
      else { a.style.color = "#cfe0ff"; }
      b.appendChild(a);
      const sz = document.createElement("span");
      sz.className = "sz";
      sz.textContent = humanSize(m.size);
      b.appendChild(sz);
    }
    row.appendChild(b);
    el.appendChild(row);
  });
  el.scrollTop = el.scrollHeight;
}

function sendText() {
  const t = $("text").value.trim();
  if (!t || !active) return;
  ws.send(JSON.stringify({ action: "chat", to: active, text: t }));
  (convos[active] ||= []).push({ mine: true, kind: "text", text: t });
  save();
  $("text").value = "";
  renderMsgs();
}

$("sendBtn").onclick = sendText;
$("text").addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });

function addByIp() {
  const ip = $("ipInput").value.trim();
  if (!ip) return;
  ws.send(JSON.stringify({ action: "addpeer", ip, port: 8765 }));
  $("ipInput").value = "";
  toast(`Connecting to ${ip}…`);
}
$("addBtn").onclick = addByIp;
$("ipInput").addEventListener("keydown", e => { if (e.key === "Enter") addByIp(); });
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = () => {
  [...$("fileInput").files].forEach(f => sendFile(f, active));
  $("fileInput").value = "";
};

function sendFile(file, peerId) {
  if (!file || !peerId) return;
  const origName = file.name;
  const entry = { mine: true, kind: "file", name: origName, size: file.size, url: null };
  (convos[peerId] ||= []).push(entry);
  if (peerId === active) renderMsgs();

  const fd = new FormData();
  fd.append("file", file);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/upload");
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) {
      entry.name = `${origName}  (${Math.round(e.loaded / e.total * 100)}%)`;
      if (peerId === active) renderMsgs();
    }
  };
  xhr.onload = () => {
    if (xhr.status === 200) {
      const r = JSON.parse(xhr.responseText);
      ws.send(JSON.stringify({ action: "file", to: peerId, fileId: r.id }));
      entry.url = "#sent";
      entry.name = origName + "  (sent ✓)";
    } else { entry.name = origName + "  (failed)"; toast("Upload failed"); }
    save();
    if (peerId === active) renderMsgs();
  };
  xhr.onerror = () => { entry.name = origName + "  (failed)"; toast("Upload failed"); };
  xhr.send(fd);
}

// drag & drop onto the chat
const drop = $("droplay");
let dragDepth = 0;
const main = document.querySelector(".main");
main.addEventListener("dragenter", e => { e.preventDefault(); if (active) { dragDepth++; drop.classList.add("show"); } });
main.addEventListener("dragover", e => e.preventDefault());
main.addEventListener("dragleave", e => { if (--dragDepth <= 0) { dragDepth = 0; drop.classList.remove("show"); } });
main.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; drop.classList.remove("show");
  if (!active) return;
  [...e.dataTransfer.files].forEach(f => sendFile(f, active));
});

function humanSize(n) {
  if (n == null) return "";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + " " + u[i];
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}
</script>
</body>
</html>

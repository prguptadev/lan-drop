<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Lan Drop</title>
<link rel="stylesheet" href="/vendor/xterm.css" />
<link id="hljsTheme" rel="stylesheet" href="/vendor/hljs-dark.css" />
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script src="/vendor/highlight.min.js"></script>
<style>
  :root {
    --bg: #1f1f23; --panel: #2a2a30; --panel2: #33333b; --accent: #5b8def;
    --text: #e8e8ec; --muted: #9a9aa5; --me: #3a5fb0; --them: #3a3a44;
    --on: #46c46a; --off: #6b6b76; --border: #00000040; --hover: #ffffff14; --divider: #33333b;
  }
  html[data-theme="light"] {
    --bg: #f3f4f7; --panel: #ffffff; --panel2: #eceef2; --accent: #2f6bed;
    --text: #1b1c1f; --muted: #74757d; --me: #2f6bed; --them: #e7e9ee;
    --on: #2faa53; --off: #b6b8c0; --border: #0000001a; --hover: #00000010; --divider: #e2e4ea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
  .sidebar { width: 270px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .me { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .me .name-row { display: flex; align-items: center; gap: 8px; }
  .me .name { font-weight: 600; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me .act { opacity: .6; cursor: pointer; font-size: 13px; }
  .me .act:hover { opacity: 1; }
  .me .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .sec { padding: 12px 16px 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; display: flex; align-items: center; justify-content: space-between; }
  .sec .add { cursor: pointer; color: var(--accent); font-size: 16px; }
  .scroll { flex: 1; overflow-y: auto; }
  .peer { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .peer:hover { background: var(--hover); }
  .peer.active { background: var(--accent); color: #fff; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--on); flex: none; }
  .dot.offline { background: var(--off); }
  .peer .pname { font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { background: #e0533a; color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; flex: none; }
  .peer .act { opacity: 0; font-size: 12px; padding: 2px 4px; border-radius: 5px; flex: none; }
  .peer:hover .act { opacity: .6; }
  .peer .act:hover { opacity: 1; background: var(--hover); }
  .peer .ptext { flex: 1; min-width: 0; }
  .peer .prow1 { display: flex; align-items: baseline; gap: 6px; }
  .peer .ptime { font-size: 11px; color: var(--muted); flex: none; }
  .peer.active .ptime { color: #ffffffcc; }
  .peer .preview { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .peer.active .preview { color: #ffffffcc; }
  .peer.unread .preview { color: var(--text); font-weight: 600; }
  .empty { padding: 14px 16px; color: var(--muted); font-size: 13px; }
  .lightbox { position: fixed; inset: 0; background: #000000ee; display: none; align-items: center; justify-content: center; z-index: 70; flex-direction: column; gap: 14px; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 84vh; border-radius: 8px; }
  .lightbox .lb-bar { display: flex; gap: 12px; }
  .lightbox .lb-bar a, .lightbox .lb-bar span { color: #fff; background: #ffffff22; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; text-decoration: none; }
  .jumpbtn { position: absolute; right: 18px; bottom: 86px; background: var(--accent); color: #fff; border-radius: 18px; padding: 7px 14px; font-size: 12px; cursor: pointer; box-shadow: 0 4px 12px #00000044; display: none; z-index: 8; }
  .jumpbtn.show { display: block; }
  .addpeer { padding: 12px 14px; border-top: 1px solid var(--border); }
  .addpeer-title { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .addpeer-row { display: flex; gap: 6px; }
  .addpeer-row input { flex: 1; min-width: 0; background: var(--panel2); border: none; color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none; }
  .addpeer-row .btn { padding: 8px 12px; font-size: 13px; }
  .addpeer .scanrow { margin-top: 8px; display: flex; gap: 6px; }
  .addpeer .ghost { flex: 1; background: var(--panel2); color: var(--text); }
  .main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
  .conn { display: none; background: #c98a25; color: #fff; font-size: 12px; text-align: center; padding: 5px; }
  .conn.show { display: block; }
  .syncbar { display: none; padding: 7px 14px; font-size: 12px; border-bottom: 1px solid var(--border); background: var(--panel); gap: 8px; align-items: center; cursor: pointer; user-select: none; }
  .syncbar.show { display: flex; }
  .syncbar .d { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .syncbar .si { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .syncbar .caret { opacity: .6; font-size: 11px; }
  .syncdrop { display: none; border-bottom: 1px solid var(--border); background: var(--panel); max-height: 240px; overflow-y: auto; }
  .syncdrop.show { display: block; }
  .syncdrop .item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 13px; }
  .syncdrop .item .d { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .syncdrop .item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .syncdrop .item .x { cursor: pointer; opacity: .6; }
  .syncdrop .item .x:hover { opacity: 1; }
  .droplay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(91,141,239,.18); border: 3px dashed var(--accent); margin: 8px; border-radius: 14px;
    font-size: 18px; font-weight: 600; color: var(--accent); pointer-events: none; z-index: 5; }
  .droplay.show { display: flex; }
  .header { padding: 12px 18px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .backBtn { display: none; cursor: pointer; font-size: 20px; margin-right: 2px; }
  .header .htitle { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header .hbtn { font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .header .hbtn:hover { background: var(--panel2); color: var(--text); }
  .msgs { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; }
  .divider { align-self: center; color: var(--muted); font-size: 11px; margin: 14px 0 8px; background: var(--divider); padding: 3px 12px; border-radius: 11px; }
  .row { display: flex; flex-direction: column; max-width: 74%; margin-top: 12px; }
  .row.grouped { margin-top: 2px; }
  .row.me { align-self: flex-end; align-items: flex-end; }
  .row.them { align-self: flex-start; align-items: flex-start; }
  .sender { font-size: 11px; color: var(--muted); margin: 0 6px 2px; }
  .bubble { padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
  .row.me .bubble { background: var(--me); color: #fff; border-bottom-right-radius: 5px; }
  .row.them .bubble { background: var(--them); color: var(--text); border-bottom-left-radius: 5px; }
  .row.me.grouped .bubble { border-top-right-radius: 6px; }
  .row.them.grouped .bubble { border-top-left-radius: 6px; }
  .bubble a.link { color: inherit; text-decoration: underline; }
  .codewrap { position: relative; margin: 4px 0; max-width: 100%; }
  .bubble pre.code { background: #1b1b22; color: #e6e6e6; border: 1px solid #ffffff14; border-radius: 10px; padding: 10px 12px; margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; line-height: 1.5; max-height: 360px; overflow: auto; white-space: pre; max-width: 100%; }
  .bubble pre.code code.hljs { background: transparent; padding: 0; }
  html[data-theme="light"] .bubble pre.code { background: #f6f8fa; color: #24292f; border-color: #d0d7de; }
  .code-copy { position: absolute; top: 7px; right: 9px; font-size: 11px; color: #cfcfcf; cursor: pointer; background: #ffffff1f; border-radius: 5px; padding: 2px 8px; opacity: 0; }
  .codewrap:hover .code-copy { opacity: 1; }
  .code-copy:hover { color: #fff; background: #ffffff33; }
  html[data-theme="light"] .code-copy { color: #57606a; background: #00000010; }
  html[data-theme="light"] .code-copy:hover { color: #111; background: #00000018; }
  .bubble.codeonly { background: transparent !important; padding: 0; width: fit-content; max-width: min(560px, 100%); }
  .codeonly .codewrap { max-width: 100%; }
  .codeonly pre.code { max-width: 100%; }
  .showmore { display: block; width: 100%; text-align: center; font-size: 12px; color: var(--accent); cursor: pointer; padding: 5px; background: none; border: none; }
  .bubble code.inlinecode { background: #00000038; border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  html[data-theme="light"] .bubble code.inlinecode { background: #00000012; }
  .longtext.collapsed { max-height: 200px; overflow: hidden; position: relative; }
  .longtext.collapsed::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: linear-gradient(transparent, var(--them)); pointer-events: none; }
  .row.me .longtext.collapsed::after { background: linear-gradient(transparent, var(--me)); }
  .sresult { padding: 8px 6px; border-radius: 8px; cursor: pointer; }
  .sresult:hover { background: var(--hover); }
  .sr-name { font-size: 12px; color: var(--muted); }
  .sr-snip { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  audio { height: 36px; max-width: 240px; }
  .meta { font-size: 10px; color: var(--muted); margin: 3px 6px 0; display: flex; gap: 6px; }
  .quote { font-size: 12px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 8px; margin-bottom: 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reacts { display: flex; gap: 4px; margin: 3px 4px 0; }
  .react { background: var(--panel2); border-radius: 10px; padding: 1px 7px; font-size: 12px; }
  .msgacts-inline { display: inline-flex; gap: 1px; margin-left: 6px; }
  .msgacts-inline span { cursor: pointer; opacity: .4; padding: 0 2px; display: inline-flex; align-items: center; }
  .msgacts-inline span:hover { opacity: 1; }
  .msgacts-inline .ic { width: 14px; height: 14px; }
  .peer.unread .pname { font-weight: 700; }
  .toast.clickable { pointer-events: auto; cursor: pointer; background: var(--accent); }
  .reactpicker { position: fixed; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px 6px; box-shadow: 0 4px 14px #00000044; z-index: 60; }
  .reactpicker span { cursor: pointer; font-size: 18px; padding: 2px 4px; border-radius: 6px; }
  .reactpicker span:hover { background: var(--hover); }
  .replybar { padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; background: var(--panel); }
  .replybar .rt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .replybar .rx { cursor: pointer; opacity: .7; }
  .thumb { max-width: 240px; max-height: 240px; border-radius: 12px; display: block; cursor: pointer; }
  .filecard { display: flex; align-items: center; gap: 10px; min-width: 200px; max-width: 280px; }
  .fileicon { width: 38px; height: 38px; border-radius: 9px; background: var(--hover); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; }
  .row.me .fileicon { background: #ffffff2a; }
  .filemeta { flex: 1; min-width: 0; }
  .filename { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filesub { font-size: 11px; opacity: .75; margin-top: 1px; }
  .filedl { text-decoration: none; color: inherit; font-size: 18px; padding: 4px; flex: none; }
  .composer { padding: 14px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
  .composer textarea { flex: 1; background: var(--panel2); border: none; color: var(--text); padding: 11px 14px; border-radius: 10px; font-size: 14px; outline: none; resize: none; font-family: inherit; line-height: 1.4; max-height: 180px; overflow-y: auto; }
  .btn { background: var(--accent); border: none; color: #fff; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .btn.icon { background: var(--panel2); color: var(--text); padding: 10px 13px; }
  .btn.icon.recording { background: #c0392b; color: #fff; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .btn.icon.recording .ic { animation: pulse 1s infinite; }
  .ic { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; }
  .btn .ic { width: 18px; height: 18px; vertical-align: -4px; }
  .btn.ghost .ic { margin-right: 4px; }
  .me .act .ic { width: 16px; height: 16px; }
  .peer .act .ic { width: 14px; height: 14px; }
  .sec .add .ic { width: 16px; height: 16px; vertical-align: -3px; }
  .backBtn .ic { width: 22px; height: 22px; }
  .fileicon .ic { width: 20px; height: 20px; }
  .filedl .ic { width: 18px; height: 18px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .xferpanel { position: fixed; bottom: 16px; right: 16px; width: 300px; display: none; flex-direction: column; gap: 8px; z-index: 45; }
  .xferpanel.show { display: flex; }
  .xfer { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; box-shadow: 0 6px 18px #00000033; }
  .xfer-top { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .xfer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xfer-x { cursor: pointer; opacity: .6; font-size: 12px; }
  .xfer-x:hover { opacity: 1; }
  .xfer-bar { height: 4px; background: var(--panel2); border-radius: 2px; margin-top: 7px; overflow: hidden; }
  .xfer-bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .xfer.done .xfer-bar > i { background: var(--on); }
  .xfer.failed .xfer-bar > i, .xfer.canceled .xfer-bar > i { background: #e0533a; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #3a3a44; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 50; pointer-events: none; }
  .toast.show { opacity: 1; }
  .overlay { position: fixed; inset: 0; background: #00000088; display: none; align-items: center; justify-content: center; z-index: 40; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border-radius: 14px; padding: 20px; width: 320px; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal input[type=text] { width: 100%; background: var(--panel2); border: none; color: var(--text); padding: 10px; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 12px; }
  .modal .mp { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 14px; cursor: pointer; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .modal .qrwrap { background: #fff; padding: 12px; border-radius: 10px; display: flex; justify-content: center; }
  .modal .qrwrap img, .modal .qrwrap svg { width: 240px; height: 240px; }
  .modal .url { text-align: center; margin-top: 10px; font-size: 13px; color: var(--accent); word-break: break-all; }
  .termbox { background: #16161b; border-radius: 12px; width: 88vw; height: 82vh; max-width: 1100px; display: flex; flex-direction: column; overflow: hidden; }
  .termhead { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #0f0f13; color: #e8e8ec; font-size: 13px; font-weight: 600; }
  .termhead .act { cursor: pointer; opacity: .7; }
  .termhead .act:hover { opacity: 1; }
  #termContainer { flex: 1; padding: 6px 8px; overflow: hidden; }
  @media (max-width: 720px) {
    .termbox { width: 100vw; height: 100vh; border-radius: 0; }
    .sidebar { width: 100%; }
    .main { position: absolute; inset: 0; display: none; }
    body.show-chat .sidebar { display: none; }
    body.show-chat .main { display: flex; }
    .backBtn { display: inline; }
    .row { max-width: 86%; }
  }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="me">
      <div class="name-row">
        <span class="name" id="myName">…</span>
        <span class="act" id="devBtn" title="Remote dev / shared folders"></span>
        <span class="act" id="searchBtn" title="Search messages"></span>
        <span class="act" id="qrBtn" title="Show QR to connect"></span>
        <span class="act" id="settingsBtn" title="Settings"></span>
        <span class="act" id="editMe" title="Rename this Mac"></span>
      </div>
      <div class="sub" id="meSub">on this network</div>
    </div>

    <div class="sec">Groups <span class="add" id="newGroupBtn" title="New group">＋</span></div>
    <div id="groups"></div>

    <div class="sec">Devices</div>
    <div class="scroll" id="peers"><div class="empty">Searching…</div></div>

    <div class="addpeer">
      <div class="addpeer-title">Add by IP (comma-separate for many)</div>
      <div class="addpeer-row">
        <input type="text" id="ipInput" placeholder="192.168.1.42, 192.168.1.43" autocomplete="off" />
        <button class="btn" id="addBtn">Add</button>
      </div>
      <div class="scanrow">
        <button class="btn ghost" id="scanBtn">🔍 Scan network</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="conn" id="conn">Reconnecting…</div>
    <div class="header">
      <span class="backBtn" id="backBtn">‹</span>
      <span class="htitle" id="header">Select a device to start</span>
      <span class="hbtn" id="projectBtn" style="display:none">Project</span>
      <span class="hbtn" id="termBtn" style="display:none">Terminal</span>
      <span class="hbtn" id="clearBtn" style="display:none">Clear chat</span>
    </div>
    <div class="syncbar" id="syncbar"></div>
    <div class="syncdrop" id="syncdrop"></div>
    <div class="msgs" id="msgs"><div class="placeholder">Pick a device or group on the left.</div></div>
    <div class="droplay" id="droplay">Drop file to send</div>
    <div class="jumpbtn" id="jumpbtn">↓ New messages</div>
    <div class="replybar" id="replybar" style="display:none"></div>
    <div class="composer" id="composer" style="display:none">
      <input type="file" id="fileInput" multiple style="display:none" />
      <input type="file" id="folderInput" webkitdirectory multiple style="display:none" />
      <button class="btn icon" id="micBtn" title="Record voice memo"></button>
      <button class="btn icon" id="clipBtn" title="Send my clipboard to this device"></button>
      <button class="btn icon" id="attachBtn" title="Send file"></button>
      <button class="btn icon" id="folderBtn" title="Send a folder (zipped)"></button>
      <textarea id="text" rows="1" placeholder="Type a message…  (Shift+Enter = newline, paste keeps formatting)"></textarea>
      <button class="btn" id="sendBtn">Send</button>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <img id="lbimg" alt="" />
    <div class="lb-bar"><a id="lbdownload" download>Download</a><span id="lbclose">Close</span></div>
  </div>
  <div class="xferpanel" id="xferpanel"></div>
  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="overlay" id="termOverlay">
    <div class="termbox">
      <div class="termhead"><span id="termTitle">Terminal</span><span class="act" id="termClose">✕</span></div>
      <div id="termContainer"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
let me = { name: "", id: "", ip: "", port: 8765 };
let peers = {};
let groups = [];
let active = null;
let activeType = "peer";
const convos = {};
const unread = {};
const msgIndex = {};
let aliases = {};
let myName = null;
let settings = { preview: true, sound: true, theme: "dark" };
let myShares = [];
let workspaces = [];

const $ = id => document.getElementById(id);
const rid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const isImg = n => /\.(png|jpe?g|gif|webp|bmp|svg|heic)$/i.test(n || "");
const isAudio = n => /\.(webm|ogg|mp3|wav|m4a|aac|opus)$/i.test(n || "");
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";

function save() { try { localStorage.setItem("td_convos", JSON.stringify(convos)); } catch (e) {} }
function saveGroups() { try { localStorage.setItem("td_groups", JSON.stringify(groups)); } catch (e) {} }
function saveAliases() { try { localStorage.setItem("td_aliases", JSON.stringify(aliases)); } catch (e) {} }
function saveSettings() { try { localStorage.setItem("td_settings", JSON.stringify(settings)); } catch (e) {} }
function load() {
  try { Object.assign(convos, JSON.parse(localStorage.getItem("td_convos") || "{}")); } catch (e) {}
  try { aliases = JSON.parse(localStorage.getItem("td_aliases") || "{}"); } catch (e) {}
  try { groups = JSON.parse(localStorage.getItem("td_groups") || "[]"); } catch (e) {}
  try { myName = localStorage.getItem("td_myname") || null; } catch (e) {}

/* ---------- connection (auto-reconnect) ---------- */
let ws;
function setConn(ok) { $("conn").classList.toggle("show", !ok); }
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setConn(true);
  ws.onmessage = handleMsg;
  ws.onclose = () => { setConn(false); setTimeout(connect, 1500); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
function wsSend(obj) { try { ws.send(JSON.stringify(obj)); } catch (e) { toast("Not connected — retrying…"); } }

function handleMsg(ev) {
  const m = JSON.parse(ev.data);
  if (m.type === "self") {
    me = m;
    $("myName").textContent = myName || m.name;
    $("meSub").textContent = `${m.ip}:${m.port}`;
    if (myName && myName !== m.name) wsSend({ action: "setname", name: myName });
  }
  else if (m.type === "peers") { renderPeers(m.peers); renderGroups(); }
  else if (m.type === "chat") incoming(m.fromId, { id: m.msgId, mine: false, kind: "text", text: m.text, ts: Date.now(), fromId: m.fromId, replyTo: m.replyTo });
  else if (m.type === "reaction") applyReaction(m.msgId, m.emoji);
  else if (m.type === "file") incoming(m.fromId, { id: m.msgId, mine: false, kind: "file", name: m.name, size: m.size, url: m.url, isImage: isImg(m.name), ts: Date.now(), fromId: m.fromId });
  else if (m.type === "status") updateStatus(m.msgId, m.state);
  else if (m.type === "scandone") toast(`Scan complete — found ${m.found} device(s)`);
  else if (m.type === "clip") toast(`Clipboard from ${m.from} — ready to paste (⌘V)`);
  else if (m.type === "toast") toast(m.text);
  else if (m.type === "myshares") { myShares = m.shares || []; renderSyncBar(); if (devModalOpen()) showDevModal(); }
  else if (m.type === "workspaces") { workspaces = m.workspaces || []; renderSyncBar(); if (devModalOpen()) showDevModal(); }
  else if (m.type === "peershares") {
    if (m.error === "pin") { savePin(peers[m.peerId] && peers[m.peerId].ip, ""); toast("Wrong PIN for that device"); }
    else if (m.error) toast("Couldn't reach that device");
    else showSharePicker(m.peerId, m.shares || []);
  }
  else if (m.type === "error") toast(m.text);
}

function renderPeers(list) {

  list.forEach(p => { const k = p.ip || p.id; if (seen[k]) return; seen[k] = 1; uniq.push(p); });
  peers = {};

    el.innerHTML = "";

      const dot = document.createElement("span"); dot.className = "dot" + (p.online ? "" : " offline");

function renderGroups() {

function loadPins() { try { return JSON.parse(localStorage.getItem("td_pins") || "{}"); } catch (e) { return {}; } }
function savePin(ip, pin) { const p = loadPins(); if (pin) p[ip] = pin; else delete p[ip]; try { localStorage.setItem("td_pins", JSON.stringify(p)); } catch (e) {} }
let curTerm = null;

$("termBtn").onclick = () => {
  if (activeType !== "peer") return;
  const p = peers[active]; if (!p || !p.terminal) { toast("Terminal isn't enabled on that device"); return; }
  let pin = loadPins()[p.ip] || "";
  if (!pin) { pin = (prompt(`Enter the PIN set on ${displayName(p)} to open its terminal:`) || "").trim(); if (!pin) return; savePin(p.ip, pin); }
  openTerminal(p, pin);
};

function openTerminal(p, pin) {
  if (typeof Terminal === "undefined") { toast("Terminal library not loaded"); return; }
  $("termContainer").innerHTML = "";
  const term = new Terminal({ cursorBlink: true, fontSize: 13, fontFamily: "ui-monospace, Menlo, monospace", theme: { background: "#16161b" } });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("termContainer"));
  const tws = new WebSocket(`ws://${p.ip}:${p.port}/termws?pin=${encodeURIComponent(pin)}`);
  tws.binaryType = "arraybuffer";
  let opened = false;
  const doResize = () => { try { fit.fit(); if (tws.readyState === 1) tws.send(JSON.stringify({ resize: [term.cols, term.rows] })); } catch (e) {} };
  tws.onopen = () => { opened = true; setTimeout(doResize, 30); };
  tws.onmessage = e => { term.write(typeof e.data === "string" ? e.data : new Uint8Array(e.data)); };
  tws.onclose = () => { if (!opened) { savePin(p.ip, ""); toast("Terminal refused — wrong PIN or not enabled"); closeTerminal(); } else term.write("\r\n\x1b[31m[disconnected]\x1b[0m\r\n"); };
  tws.onerror = () => { if (!opened) { savePin(p.ip, ""); toast("Could not open terminal"); } };
  term.onData(d => { if (tws.readyState === 1) tws.send(new TextEncoder().encode(d)); });
  window.addEventListener("resize", doResize);
  curTerm = { term, ws: tws, resize: doResize };
  $("termTitle").textContent = `Terminal — ${displayName(p)}`;
  $("termOverlay").classList.add("show");
  setTimeout(() => { doResize(); term.focus(); }, 60);
}

function closeTerminal() {
  $("termOverlay").classList.remove("show");
  if (curTerm) {
    window.removeEventListener("resize", curTerm.resize);
    try { curTerm.ws.close(); } catch (e) {}
    try { curTerm.term.dispose(); } catch (e) {}
    curTerm = null;
  }
}
$("termClose").onclick = closeTerminal;

function statusColor(st) {

  return "#46c46a";
}
function uniqWorkspaces() {

  return out;
}
function renderSyncBar() {
  const ws = uniqWorkspaces();

  const items = [];
  ws.forEach(w => items.push({ kind: "ws", id: w.id, color: statusColor(w.status || ""), name: w.name, status: w.status || "" }));
  myShares.forEach(s => items.push({ kind: "share", color: s.active ? "#46c46a" : "#6b6b76", name: s.name, status: s.active ? `syncing now${s.writes ? ` · ${s.writes}↑` : ""}` : "shared" }));

    const busy = ws.filter(w => /connect|pull/i.test(w.status || "")).length;

function activeMembers() {

function groupHasPeer(gid, pid) {
  const g = groups.find(x => x.id === gid); const p = peers[pid];
  return !!(g && p && g.memberIps.includes(p.ip));
}
function currentMessages() {

    Object.values(peers).filter(p => g.memberIps.includes(p.ip)).forEach(p => {

function tickFor(s) { return s === "delivered" ? "✓✓" : s === "sent" ? "✓" : s === "failed" ? "⚠️" : s === "queued" ? "⏳" : "🕓"; }

function dayLabel(ts) {
  const d = new Date(ts), now = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, now)) return "Today";
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (same(d, y)) return "Yesterday";
  const opt = { month: "short", day: "numeric" };
  if (d.getFullYear() !== now.getFullYear()) opt.year = "numeric";
  return d.toLocaleDateString([], opt);
}
function looksLikeCode(text) {
  if (!text) return false;
  if (text.split("\n").length < 2) return false;
  // strong code signals only — avoids turning normal multi-line prose into a code block
  const codeHints = /(=>|;\s*$|\{\s*$|^\s*[}\])];?\s*$|\b(function|const|let|var|def|class|import|export|public|private|async|await)\b|^\s*(#include|package |using |from\s+\S+\s+import))/m;
  const mermaid = /\b(sequenceDiagram|graph\s+(TD|LR|BT|RL)|flowchart|classDiagram|gantt|stateDiagram|erDiagram|journey|participant)\b|->>|-->>/;
  return codeHints.test(text) || mermaid.test(text);
}
function makeCodeBlock(container, body, lang) {
  body = body.replace(/\n$/, "");
  const wrap = document.createElement("div"); wrap.className = "codewrap";
  const pre = document.createElement("pre"); pre.className = "code";
  const codeEl = document.createElement("code"); codeEl.textContent = body;
  pre.appendChild(codeEl);
  try {
    if (window.hljs) {
      if (lang && hljs.getLanguage(lang)) { codeEl.className = "language-" + lang; hljs.highlightElement(codeEl); }
      else { codeEl.innerHTML = hljs.highlightAuto(body).value; }
    }
  } catch (e) {}
  const cc = document.createElement("span"); cc.className = "code-copy"; cc.textContent = "Copy";
  cc.onclick = ev => { ev.stopPropagation(); if (navigator.clipboard) navigator.clipboard.writeText(body).then(() => toast("Code copied")); };
  wrap.append(pre, cc);
  container.appendChild(wrap);
}
function renderRichText(container, text) {
  text = String(text);
  if (text.includes("```")) {
    const segs = text.split("```");
    const hasText = segs.some((p, i) => i % 2 === 0 && p.trim());
    segs.forEach((part, i) => {
      if (i % 2 === 1) {
        let body = part, lang = "";
        const nl = part.indexOf("\n");
        if (nl !== -1 && /^[a-zA-Z0-9+#.\-]*$/.test(part.slice(0, nl).trim())) { lang = part.slice(0, nl).trim(); body = part.slice(nl + 1); }
        makeCodeBlock(container, body, lang);
      } else renderInline(container, part);
    });
    if (!hasText) container.classList.add("codeonly");
  } else if (looksLikeCode(text)) {
    makeCodeBlock(container, text, "");
    container.classList.add("codeonly");
  } else if (text.length > 600 || text.split("\n").length > 12) {
    const wrap = document.createElement("div"); wrap.className = "longtext collapsed";
    renderInline(wrap, text); container.appendChild(wrap);
    const btn = document.createElement("button"); btn.className = "showmore"; btn.textContent = "Show more";
    btn.onclick = ev => { ev.stopPropagation(); const c = wrap.classList.toggle("collapsed"); btn.textContent = c ? "Show more" : "Show less"; };
    container.appendChild(btn);
  } else {

  }
}
function renderInline(container, text) {
  const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*]+\*)|(https?:\/\/[^\s]+)/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) container.appendChild(document.createTextNode(text.slice(last, m.index)));
    const tok = m[0];
    if (tok.startsWith("`")) { const c = document.createElement("code"); c.className = "inlinecode"; c.textContent = tok.slice(1, -1); container.appendChild(c); }
    else if (tok.startsWith("**")) { const s = document.createElement("strong"); s.textContent = tok.slice(2, -2); container.appendChild(s); }
    else if (tok.startsWith("*")) { const s = document.createElement("em"); s.textContent = tok.slice(1, -1); container.appendChild(s); }
    else { const a = document.createElement("a"); a.className = "link"; a.href = tok; a.textContent = tok; a.target = "_blank"; a.rel = "noopener noreferrer"; container.appendChild(a); }
    last = m.index + tok.length;
  }
  if (last < text.length) container.appendChild(document.createTextNode(text.slice(last)));
}

function fileCard(m) {

function renderMsgs() {
  const el = $("msgs");
  const list = currentMessages();
  if (!list.length) { el.innerHTML = '<div class="placeholder">No messages yet. Say hi 👋</div>'; return; }
  el.innerHTML = "";
  let prevDay = null, prevSender = null, prevTs = 0;
  list.forEach(m => {
    const senderKey = m.mine ? "me" : (m.fromId || "them");
    if (m.ts && (!prevDay || new Date(m.ts).toDateString() !== prevDay)) {
      const div = document.createElement("div"); div.className = "divider"; div.textContent = dayLabel(m.ts);
      el.appendChild(div); prevDay = new Date(m.ts).toDateString(); prevSender = null;
    }
    const grouped = senderKey === prevSender && m.ts - prevTs < 5 * 60 * 1000;
    const row = document.createElement("div");
    row.className = "row " + (m.mine ? "me" : "them") + (grouped ? " grouped" : "");
    if (!grouped && !m.mine && activeType === "group" && m.fromName) {
      const s = document.createElement("div"); s.className = "sender"; s.textContent = m.fromName; row.appendChild(s);
    }
    if (m.replyTo) {
      const q = document.createElement("div"); q.className = "quote";
      q.textContent = (m.replyTo.from ? m.replyTo.from + ": " : "") + (m.replyTo.text || "");
      row.appendChild(q);
    }
    const b = document.createElement("div"); b.className = "bubble";
    if (m.kind === "text") { renderRichText(b, m.text); }
    else if (m.isImage && settings.preview && (m.previewUrl || m.url)) {
      const img = document.createElement("img"); img.className = "thumb"; img.src = m.previewUrl || m.url;
      img.onclick = () => openLightbox(m.previewUrl || m.url, m.url, m.name);
      b.appendChild(img);
    } else if (isAudio(m.name) && (m.previewUrl || m.url)) {
      const au = document.createElement("audio"); au.controls = true; au.src = m.previewUrl || m.url; b.appendChild(au);
    } else b.appendChild(fileCard(m));
    row.appendChild(b);
    const meta = document.createElement("div"); meta.className = "meta";
    const t = document.createElement("span"); t.textContent = fmtTime(m.ts); meta.appendChild(t);
    if (m.mine && activeType === "peer") { const tk = document.createElement("span"); tk.textContent = tickFor(m.status); meta.appendChild(tk); }
    const acts = document.createElement("span"); acts.className = "msgacts-inline";
    const cp = document.createElement("span"); cp.innerHTML = svg("copy"); cp.title = "Copy"; cp.onclick = ev => { ev.stopPropagation(); copyMsg(m); };
    const rb = document.createElement("span"); rb.innerHTML = svg("reply"); rb.title = "Reply"; rb.onclick = ev => { ev.stopPropagation(); setReply(m); };
    const eb = document.createElement("span"); eb.innerHTML = svg("smile"); eb.title = "React"; eb.onclick = ev => openReactPicker(ev, m);
    acts.append(cp, rb, eb); meta.appendChild(acts);
    row.appendChild(meta);
    if (m.reactions && Object.keys(m.reactions).length) {
      const rc = document.createElement("div"); rc.className = "reacts";
      Object.entries(m.reactions).forEach(([em, c]) => { const s = document.createElement("span"); s.className = "react"; s.textContent = c > 1 ? `${em} ${c}` : em; rc.appendChild(s); });
      row.appendChild(rc);
    }
    el.appendChild(row);
    prevSender = senderKey; prevTs = m.ts || 0;
  });
  if (atBottom) el.scrollTop = el.scrollHeight; else $("jumpbtn").classList.add("show");
}

function updateStatus(id, state) {

let replyTarget = null;

function findMsg(id) {
  for (const k in convos) { const m = (convos[k] || []).find(x => x.id === id); if (m) return { m, key: k }; }
  return null;
}
function applyReaction(id, emoji) {
  const f = findMsg(id); if (!f) return;
  (f.m.reactions ||= {}); f.m.reactions[emoji] = (f.m.reactions[emoji] || 0) + 1;
  save(); if (active) renderMsgs();
}
function copyMsg(m) {
  const text = m.kind === "text" ? m.text : (m.name || "");
  if (!text) return;
  const ok = () => toast("Copied");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(fallbackCopy);
  } else fallbackCopy();
  function fallbackCopy() {
    const ta = document.createElement("textarea"); ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) { toast("Copy failed"); }
    ta.remove();
  }
}
function react(m, emoji) {
  (m.reactions ||= {}); m.reactions[emoji] = (m.reactions[emoji] || 0) + 1;
  save(); if (active) renderMsgs();

const REACT_EMOJIS = ["👍", "❤️", "😂", "🎉", "✅", "👀"];
function closeReactPicker() { const p = $("reactpicker"); if (p) p.remove(); }

  ev.stopPropagation(); closeReactPicker();
  const menu = document.createElement("div"); menu.className = "reactpicker"; menu.id = "reactpicker";
  REACT_EMOJIS.forEach(em => { const b = document.createElement("span"); b.textContent = em; b.onclick = () => { react(m, em); closeReactPicker(); }; menu.appendChild(b); });
  document.body.appendChild(menu);

  menu.style.top = Math.max(8, r.top - 44) + "px";

function sendText() {
  const t = $("text").value.replace(/\s+$/, "");   // keep leading/inner formatting, drop trailing
  if (!t.trim() || !active) return;
  const targets = activeMembers();
  if (!targets.length) { toast("No reachable devices in this view"); return; }
  const entry = { id: rid(), mine: true, kind: "text", text: t, ts: Date.now(), status: "sending" };
  if (replyTarget) entry.replyTo = { ...replyTarget };
  (convos[active] ||= []).push(entry);
  targets.forEach(pid => {
    const mid = targets.length === 1 ? entry.id : rid();
    msgIndex[mid] = { key: active, entry };
    wsSend({ action: "chat", to: pid, text: t, msgId: mid, replyTo: entry.replyTo });
  });
  clearReply();
  save(); $("text").value = ""; autoGrow(); renderMsgs(); renderPeers(Object.values(peers));
}
function autoGrow() { const ta = $("text"); ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 180) + "px"; }

function sendFileToActive(file) {
  if (!file || !active) return;
  const targets = activeMembers();
  if (!targets.length) { toast("No reachable devices in this view"); return; }
  const isI = isImg(file.name);
  const localPreview = (isI || isAudio(file.name)) ? URL.createObjectURL(file) : null;
  const entry = { id: rid(), mine: true, kind: "file", name: file.name, size: file.size, url: null, previewUrl: localPreview, isImage: isI, ts: Date.now(), status: "sending" };
  (convos[active] ||= []).push(entry); renderMsgs();
  const fd = new FormData(); fd.append("file", file);
  const xhr = new XMLHttpRequest(); xhr.open("POST", "/upload");
  const tr = addTransfer(file.name, xhr);
  xhr.upload.onprogress = e => { if (e.lengthComputable) { entry.prog = Math.round(e.loaded / e.total * 100); tr.pct = entry.prog; renderTransfers(); if (active) renderMsgs(); } };
  xhr.onload = () => {
    if (xhr.status === 200) {
      const r = JSON.parse(xhr.responseText); entry.prog = null;
      tr.status = "done"; tr.done = Date.now();
      targets.forEach(pid => {
        const mid = targets.length === 1 ? entry.id : rid();
        msgIndex[mid] = { key: active, entry };
        wsSend({ action: "file", to: pid, fileId: r.id, msgId: mid });
      });
      entry.status = "sent";   // dispatched; 'delivered' ack will upgrade to ✓✓
    } else { entry.status = "failed"; tr.status = "failed"; tr.done = Date.now(); toast("Upload failed"); }
    renderTransfers(); save(); if (active) renderMsgs();
  };
  xhr.onerror = () => { entry.status = "failed"; tr.status = "failed"; tr.done = Date.now(); renderTransfers(); if (active) renderMsgs(); };
  xhr.onabort = () => { entry.status = "failed"; entry.name = file.name + " (canceled)"; if (active) renderMsgs(); };
  xhr.send(fd);
}

// voice memo
let mediaRecorder = null, recChunks = [];
$("micBtn").onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); return; }
  if (!active) { toast("Pick a device first"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    recChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      $("micBtn").innerHTML = svg("mic"); $("micBtn").classList.remove("recording");
      if (recChunks.length) {
        const blob = new Blob(recChunks, { type: "audio/webm" });
        sendFileToActive(new File([blob], `voice-${Date.now()}.webm`, { type: "audio/webm" }));
      }
    };
    mediaRecorder.start();
    $("micBtn").innerHTML = svg("stop"); $("micBtn").classList.add("recording");
    toast("Recording… tap the mic again to send");
  } catch (e) { toast("Microphone permission denied"); }
};

  xhr.onload = () => {

function labelForKey(key) {
  if (peers[key]) return displayName(peers[key]);
  const g = groups.find(x => x.id === key); if (g) return g.name;
  return "Conversation";
}
function openKey(key) {

  else if (peers[key]) selectPeer(key);

}
function runSearch() {
  const q = $("searchInput").value.trim().toLowerCase();

/* ---------- helpers ---------- */
function humanSize(n) {
  if (n == null) return "";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + " " + u[i];
}
/* ---------- transfer panel ---------- */
const transfers = [];
function addTransfer(name, xhr) {
  const tr = { id: rid(), name, pct: 0, status: "uploading", xhr, done: 0 };
  transfers.unshift(tr);
  renderTransfers();
  return tr;
}
function renderTransfers() {
  const now = Date.now();
  const show = transfers.filter(t => t.status === "uploading" || (t.done && now - t.done < 4000));
  const panel = $("xferpanel");
  panel.innerHTML = "";
  if (!show.length) { panel.classList.remove("show"); return; }
  show.forEach(t => {
    const el = document.createElement("div"); el.className = "xfer " + t.status;
    const top = document.createElement("div"); top.className = "xfer-top";
    const nm = document.createElement("span"); nm.className = "xfer-name"; nm.textContent = t.name;
    const st = document.createElement("span"); st.textContent = t.status === "uploading" ? `${t.pct}%` : t.status === "done" ? "✓" : t.status === "canceled" ? "canceled" : "failed";
    top.append(nm, st);
    if (t.status === "uploading") {
      const x = document.createElement("span"); x.className = "xfer-x"; x.textContent = "✕"; x.title = "Cancel";
      x.onclick = () => { try { t.xhr.abort(); } catch (e) {} t.status = "canceled"; t.done = Date.now(); renderTransfers(); };
      top.append(x);
    }
    const bar = document.createElement("div"); bar.className = "xfer-bar";
    const i = document.createElement("i"); i.style.width = (t.status === "uploading" ? t.pct : 100) + "%"; bar.append(i);
    el.append(top, bar); panel.append(el);
  });
  panel.classList.add("show");
  setTimeout(renderTransfers, 4100);
}

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show"); t.classList.remove("clickable"); t.onclick = null;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}
function toastClick(msg, fn) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show", "clickable");
  t.onclick = () => { t.classList.remove("show", "clickable"); t.onclick = null; fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove("show", "clickable"); t.onclick = null; }, 6000);
}
function notify(title, body, fromId) {
  if ("Notification" in window && Notification.permission === "granted")
    try {
      const n = new Notification(title, { body });
      if (fromId) n.onclick = () => { window.focus(); selectPeer(fromId); };
    } catch (e) {}
}
let audioCtx;
function beep() {
  if (!settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 660; o.type = "sine";
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    o.start(); o.stop(audioCtx.currentTime + 0.26);
  } catch (e) {}
}

function fileIconName(name) {
